services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Add your production CORS origins here (comma-separated).
      # Defaults to localhost:5173 (dev) when unset.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Persist cache and backtest data on the host so they survive container restarts.
      - ./cache:/app/cache
      - ./backtest:/app/backtest
    ports:
      - "8000:8000"     # Exposed for direct access / debugging. Remove in pure-nginx setups.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
