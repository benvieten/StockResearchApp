anthropic:
  models:
    technical: "claude-haiku-4-5-20251001"
    fundamental: "claude-haiku-4-5-20251001"
    quant: "claude-haiku-4-5-20251001"
    sector: "claude-sonnet-4-6"
    sentiment: "claude-sonnet-4-6"
    synthesis: "claude-sonnet-4-6"
    explain_simple: "claude-haiku-4-5-20251001"

# Default weights (used as fallback if regime detection fails)
# analyst = Wall Street consensus targets (12-month price targets + rec rating)
signal_weights:
  fundamental: 0.27
  technical: 0.18
  sentiment: 0.18
  sector: 0.18
  quant: 0.09
  analyst: 0.10

# Regime-conditioned weight presets — synthesis agent selects based on market regime.
# In bull regimes, momentum/technical signals are more reliable.
# In bear regimes, fundamental quality and quant factors dominate.
# In transitional regimes, weights revert toward the default balanced allocation.
# analyst weight is slightly higher in bear (targets are reset lower, upside is meaningful)
# and slightly higher in bull (consensus upgrades drive momentum).
regime_signal_weights:
  bull:
    fundamental: 0.22
    technical: 0.27
    sentiment: 0.13
    sector: 0.18
    quant: 0.09
    analyst: 0.11
  bear:
    fundamental: 0.36
    technical: 0.13
    sentiment: 0.09
    sector: 0.13
    quant: 0.18
    analyst: 0.11
  transitional:
    fundamental: 0.27
    technical: 0.18
    sentiment: 0.18
    sector: 0.18
    quant: 0.09
    analyst: 0.10

cache:
  enabled: true
  directory: "./cache"
  ttl_hours: 24
  # Increment version when data shape changes to bust stale cache entries
  schema_version: 1

rate_limits:
  reddit_delay_seconds: 1.0
  anthropic_retry_max_attempts: 4
  anthropic_retry_base_delay_seconds: 2
  anthropic_retry_jitter_seconds: 0.5

data_sources:
  reddit_subreddits:
    - wallstreetbets
    - stocks
    - investing
    - SecurityAnalysis
  reddit_limit: 50

sector_etf_map:
  Technology: XLK
  Healthcare: XLV
  Financials: XLF
  "Consumer Discretionary": XLY
  "Consumer Staples": XLP
  Energy: XLE
  Industrials: XLI
  Materials: XLB
  "Real Estate": XLRE
  Utilities: XLU
  "Communication Services": XLC

# Quant factor normalization bounds
quant:
  earnings_yield_min: 0.0
  earnings_yield_max: 0.15
  volatility_window_days: 90
  momentum_windows_months: [3, 6, 12]

screener:
  top_n: 15
  min_market_cap_millions: 500
  min_avg_volume: 500000
  screener_queries:
    - most_actives
    - day_gainers
    - undervalued_large_caps

watchlist:
  max_concurrent: 2

# Synthesis verdict thresholds (composite score)
synthesis:
  strong_buy_threshold: 0.75
  buy_threshold: 0.60
  hold_threshold: 0.40
  sell_threshold: 0.25
