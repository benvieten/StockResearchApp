name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint + Test (phase2 & phase3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Ruff
        run: python -m ruff check backend/

      - name: Black
        run: python -m black --check backend/

      # ── Tests ───────────────────────────────────────────────────────────────
      # Phase 2: schema + config validation — no I/O, no API key needed
      # Phase 3: agent signal tests — uses committed fixtures, no API key needed
      # Phase 1 + 4 are excluded: phase1 needs live network, phase4 needs API key
      - name: pytest (phase2 + phase3)
        run: python -m pytest -m "phase2 or phase3" -v
        env:
          ANTHROPIC_API_KEY: "placeholder"   # satisfies any env checks; not used by phase2/3
